<div class="auth-page">
  <div class="auth-card">
    <div class="auth-visual">
      <img src="../../../assets/readify_image.jpg" alt="Readify cover">
      <div class="auth-visual__overlay">
        <h2>Welcome back</h2>
        <p>Sign in to continue exploring your next favorite read.</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="brand-header">
        <img src="../../../assets/logo.avif" alt="Readify logo" width="70" height="70">
        <div>
          <h1>Readify Market</h1>
          <p>Login to your account</p>
        </div>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSignin()" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input id="email" type="email" class="form-control" placeholder="Enter your email" formControlName="email">
          </div>
          <div class="error-block" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            <small class="text-danger" *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</small>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="password" [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Enter your password" formControlName="password">
            <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()">
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          <div class="error-block" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            <small class="text-danger" *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</small>
            <small class="text-danger" *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</small>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <a routerLink="/forgot-password" class="text-primary fw-semibold">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
        <p class="text-center mt-3 mb-0">
          Don’t have an account?
          <a routerLink="/signUp" class="text-primary fw-semibold">Sign Up</a>
        </p>
      </form>
    </div>
  </div>
</div>
