<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 px-3">
  <a class="navbar-brand" routerLink="/">Readify Market</a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" (click)="toggleNav()">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div #navbar class="collapse navbar-collapse justify-content-end" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="btn text-white" routerLink="/">Home</a>
      </li>
      <ng-container *ngIf="isUser; else isAdmin">
        <li class="nav-item">
          <a class="btn text-white" routerLink="/books">Books</a>
        </li>
        <li class="nav-item">
          <a class="btn text-white" routerLink="/myreview">Reviews</a>
        </li>
        <li class="nav-item position-relative">
          <a class="btn text-white" (click)="toggleCart()">🛒
            <span class="position-absolute top-0 translate-middle badge rounded-pill bg-danger">
              {{ cartItemCount }}
            </span>
          </a>
        </li>
      </ng-container>
      <ng-template #isAdmin>
        <li class="nav-item">
          <a class="btn text-white" routerLink="/dashboard">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="btn text-white" routerLink="/adminviewbooks">Books</a>
        </li>
        <li class="nav-item">
          <a class="btn text-white" routerLink="/ordersplaced">Orders</a>
        </li>
        <li class="nav-item">
          <a class="btn text-white" routerLink="/adminviewreview">Reviews</a>
        </li>
      </ng-template>
      <li class="nav-item">
        <a class="btn text-white ms-2" [ngClass]="{'btn-danger':loginToggler,'btn-warning':!loginToggler}"
          (click)="loginLogout()">{{loginToggler? 'Logout':'Login'}}</a>
      </li>
    </ul>
  </div>
</nav>

<div class="cart-slider bg-light shadow" [class.open]="showCartSlider">
  <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <h4>Your Cart</h4>
    <button class="btn btn-sm btn-outline-danger" (click)="toggleCart()">✖</button>
  </div>

  <div *ngFor="let item of cart" class="p-3 border-bottom">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ item.book.name }}</strong><br>
        ${{ item.book.price }} × {{ item.quantity }}
      </div>
      <div class="d-flex gap-1">
        <button class="btn btn-sm btn-outline-secondary" (click)="decreaseQuantity(item.book._id)">−</button>
        <button class="btn btn-sm btn-outline-secondary" (click)="increaseQuantity(item.book._id)">+</button>
        <button class="btn btn-sm btn-outline-danger" (click)="removeItem(item.book._id)">🗑️</button>
      </div>
    </div>
  </div>

  <div class="p-3">
    <button class="btn btn-success w-100" (click)="goToCheckout()">Checkout</button>
  </div>
</div>
