<div class="book-form-page">
  <app-usernav></app-usernav>

  <div class="book-form-shell">
    <div class="book-form-card">
      <div class="book-form-header">
        <h2>Add New Book</h2>
        <p>Fill in the details below to add a new title to your library.</p>
      </div>

      <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="book-form-grid" novalidate>
        <div class="form-group">
          <label for="name">Book name</label>
          <input class="form-control" type="text" id="name" formControlName="name">
          <div class="error-block" *ngIf="bookForm.get('name')?.touched && bookForm.get('name')?.invalid">
            <small class="text-danger" *ngIf="bookForm.get('name')?.errors?.['required']">Book name is required</small>
          </div>
        </div>

        <div class="form-group">
          <label for="author">Book author</label>
          <input class="form-control" type="text" id="author" formControlName="author">
          <div class="error-block" *ngIf="bookForm.get('author')?.touched && bookForm.get('author')?.invalid">
            <small class="text-danger" *ngIf="bookForm.get('author')?.errors?.['required']">Book author is required</small>
          </div>
        </div>

        <div class="form-group">
          <label for="price">Book price</label>
          <input class="form-control" type="number" id="price" formControlName="price">
          <div class="error-block" *ngIf="bookForm.get('price')?.touched && bookForm.get('price')?.invalid">
            <small class="text-danger" *ngIf="bookForm.get('price')?.errors?.['required']">Book price is required</small>
          </div>
        </div>

        <div class="form-group">
          <label for="stockQuantity">Stock quantity</label>
          <input class="form-control" type="text" id="stockQuantity" formControlName="stockQuantity">
          <div class="error-block" *ngIf="bookForm.get('stockQuantity')?.touched && bookForm.get('stockQuantity')?.invalid">
            <small class="text-danger" *ngIf="bookForm.get('stockQuantity')?.errors?.['required']">Stock quantity is required</small>
          </div>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" formControlName="category" class="form-select">
            <option value="" selected disabled>Select category</option>
            <option value="Fiction">Fiction</option>
          </select>
          <div class="error-block" *ngIf="bookForm.get('category')?.touched && bookForm.get('category')?.invalid">
            <small class="text-danger" *ngIf="bookForm.get('category')?.errors?.['required']">Category is required</small>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="description">Description</label>
          <textarea id="description" rows="3" class="form-control" formControlName="description"></textarea>
          <div class="error-block" *ngIf="bookForm.get('description')?.touched && bookForm.get('description')?.invalid">
            <small class="text-danger" *ngIf="bookForm.get('description')?.errors?.['required']">Description is required</small>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="image">Book image</label>
          <input class="form-control" type="file" id="image" (change)="onImageSelected($event)" accept="image/*">
          <div class="error-block" *ngIf="bookForm.get('image')?.touched && bookForm.get('image')?.invalid">
            <small class="text-danger" *ngIf="bookForm.get('image')?.errors?.['required']">Book image is required</small>
          </div>
        </div>

        <div class="preview-box full-width" *ngIf="bookForm.get('image')?.value">
          <img [src]="bookForm.get('image')?.value" alt="Book preview">
        </div>

        <button type="submit" class="btn btn-success w-100 full-width">Add Book</button>
      </form>
    </div>
  </div>
</div>
