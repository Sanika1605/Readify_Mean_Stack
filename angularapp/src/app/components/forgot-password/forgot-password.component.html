<div class="forgot-password-page">
  <div class="row shadow-lg rounded overflow-hidden w-100 g-0">
    <div class="col-12 col-md-6 order-2 order-md-1">
      <div class="form-panel">
        <img src="/assets/logo.avif" alt="logo" width="80" height="80">
        <h1>Readify Market</h1>
        <h4>Forgot Password</h4>
        <p><i>Enter your email to reset your password</i></p>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onReset()" class="w-100">
          <div class="input-group my-2">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" placeholder="Enter your email" formControlName="email">
          </div>
          <div *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid">
            <small class="text-danger" *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email is required</small>
          </div>

          <div class="input-group my-2">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Enter your new password"
              formControlName="password">
            <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()">
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          <div *ngIf="forgotPasswordForm.get('password')?.touched && forgotPasswordForm.get('password')?.invalid">
            <small class="text-danger" *ngIf="forgotPasswordForm.get('password')?.errors?.['required']">Password is required</small>
            <small class="text-danger" *ngIf="forgotPasswordForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</small>
          </div>

          <div class="input-group my-2">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
              placeholder="Confirm your password" formControlName="confirm_password">
            <button type="button" class="btn btn-outline-secondary" (click)="toggleConfirmPasswordVisibility()">
              <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          <div *ngIf="forgotPasswordForm.get('confirm_password')?.touched && forgotPasswordForm.get('confirm_password')?.invalid">
            <small class="text-danger" *ngIf="forgotPasswordForm.get('confirm_password')?.errors?.['required']">Confirm Password is required</small>
          </div>
          <div *ngIf="forgotPasswordForm.errors?.['passwordMismatch'] && forgotPasswordForm.get('confirm_password')?.touched">
            <small class="text-danger">Passwords do not match</small>
          </div>

          <button type="submit" class="btn btn-primary my-2 w-100">Reset Password</button>
          <h3 class="text-center">Remember Password?<a routerLink="/login" class="btn text-primary">Login</a></h3>
        </form>
      </div>
    </div>

    <div class="col-12 col-md-6 order-1 order-md-2">
      <img src="/assets/forget_password_image.jpg" alt="Readify illustration" class="forgot-password-image">
    </div>
  </div>
</div>
