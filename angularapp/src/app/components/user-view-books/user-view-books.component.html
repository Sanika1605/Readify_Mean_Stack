<app-usernav></app-usernav>
<div class="container">
    <div class="d-flex flex-column justify-content-center align-items-center my-3">
        <h1 class="text-center d-block">📚 Books</h1>
        <input type="text" placeholder="Search books..." class="form-control w-50"
            (input)="onSearchChange(($any($event.target)).value)" style="border-radius: 20px;">
    </div>
    <div class="row justify-content-center">
        
<div *ngFor="let book of filteredBooks" class="col-12 col-sm-6 col-md-4 col-lg-4 mb-4">
    <div class="card h-100 position-relative"
         [ngStyle]="book.stockQuantity === 0 ? {'filter': 'brightness(60%)'} : {}">
  
      <div *ngIf="book.stockQuantity === 0"
           class="position-absolute top-0 start-0 bg-danger text-white px-2 py-1 rounded">
        Not Available
      </div>

    <div class="book-image-box">
      <img [src]="book.image" alt="{{ book.name }}" class="book-image">
    </div>
    <div class="card-body d-flex flex-column justify-content-between">
        <h2 class="card-title">{{ book.name }}</h2>
        <p class="card-text">Price: {{ book.price }}</p>
        <p class="card-text">Author: {{ book.author }}</p>
        <p class="card-text">Stock: {{ book.stockQuantity }}</p>
        <p class="card-text">Category: {{ book.category }}</p>
  
        <div class="mt-auto justify-content-between">
          <button class="btn bg-primary-subtle my-1 col-12"
                  [disabled]="book.stockQuantity === 0"
                  (click)="addToCart(book)">
            ADD TO CART
          </button>
  
          <div class="d-flex gap-1">
            <button class="btn bg-warning-subtle col-6"
                    (click)="getReview(book._id)"
                    data-bs-toggle="modal"
                    data-bs-target="#orderItemsModal">
              View Reviews
            </button>
            <button class="btn bg-danger-subtle col-6"
                    (click)="addReview(book._id)">
              Write Review
            </button>
        </div>
      </div>
    </div>
  </div>
</div>

    </div>

    <div class="modal fade" id="orderItemsModal" tabindex="-1" aria-labelledby="orderItemsModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Reviews</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div *ngIf="reviews.length > 0; else noItems">
                        <div class="card content w-100 p-4 border-start shadow rounded-2 mb-3"
                            *ngFor="let review of reviews">
                            <div class="d-flex gap-3 align-items-start">
                                <div>
                                    <p><strong>{{username}}</strong></p>
                                    <p><strong>Date:</strong> {{ review.date | date }}</p>
                                    <p><strong>Rating:</strong>
                                        <span *ngFor="let star of getStars(review.rating)">⭐</span>
                                    </p>
                                    <p><strong>Review:</strong> {{ review.reviewText }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <ng-template #noItems>
                        <p>No reviews found for this book.</p>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
